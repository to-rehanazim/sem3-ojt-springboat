
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In</title>

</head>

<body>

    <div class="main">

        <p class="sign" align="center">Sign in</p>

        <form class="form1">

            <input
                class="un"
                type="text"
                placeholder="Username"
                required
            >

            <input
                class="pass"
                type="password"
                placeholder="Password"
                required
            >

            <button
                class="submit"
                type="submit"
            >
                Sign in
            </button>

            <p class="forgot" align="center">
                <a href="#">Forgot Password?</a>
            </p>

        </form>

    </div>

</body>

</html>
